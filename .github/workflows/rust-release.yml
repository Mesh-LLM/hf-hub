name: Rust Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Release version or tag, for example 1.0.1 or v1.0.1
        required: true
        type: string
      dry_run:
        description: Validate packaging without publishing to crates.io
        required: true
        default: true
        type: boolean

concurrency:
  group: crates-io-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  rust_publish:
    runs-on:
      group: aws-general-8-plus
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Set up HF registry proxies
        uses: huggingface/hf-workflows/.github/actions/setup-hf-registry-proxies@21845492ef47d4e46b07a3b2a6e14fd4748c39cc  # main

      - name: Cache Cargo Registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5
        with:
          path: ~/.cargo/registry
          key: aws-general-8-plus-cargo-registry-${{ hashFiles('**/Cargo.toml') }}

      - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1
        id: auth
        if: github.event_name == 'push' || inputs.dry_run == false

      - name: Validate release version
        shell: bash
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$RELEASE_INPUT"
          fi
          release_tag="v${release_tag#v}"
          release_version="${release_tag#v}"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $release_tag" >&2
            exit 1
          fi
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "hf-hub") | .version')"
          if [[ "$package_version" != "$release_version" ]]; then
            echo "Tag $release_tag does not match hf-hub version $package_version" >&2
            exit 1
          fi

      - name: Dry-run package
        run: cargo publish --registry crates-io --locked --dry-run

      - name: Publish package to crates.io
        if: github.event_name == 'push' || inputs.dry_run == false
        # --registry crates-io bypasses the hf-mirror registry proxy (which cannot publish).
        run: cargo publish --registry crates-io --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
